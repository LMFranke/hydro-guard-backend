spring:
  devtools:
    restart:
      enabled: false

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

api:
  security:
    token:
      secret: ${JWT_SECRET}
  ana:
    base-url: https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas
    identifier: ${ANA_IDENTIFIER}
    password: ${ANA_PASSWORD}

  server:
    compression:
      enabled: true
      min-response-size: 1024
      mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css